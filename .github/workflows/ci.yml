name: CI & Quality Check

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Test Production Build
        run: npm run build

      # --- DOCKER STEPS ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Test Docker build on PRs without pushing
      - name: Validate Docker Image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false

      # Log in to Docker Hub ONLY when pushing/merging to prod
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'

      # Build and push image ONLY when pushing/merging to prod
      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            "${{ secrets.DOCKER_USERNAME }}/my-app:latest"
            "${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
